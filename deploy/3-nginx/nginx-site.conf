# nveil site configuration for nginx (run nginx itself on the shared
# "proxy" Docker network, certificates via certbot).
#
# Key requirements:
#   - TLS is mandatory; nveil refuses to work over plain HTTP in browsers
#   - Do NOT rewrite or strip response headers — the app's CSP/nonce
#     middleware needs them untouched
#   - Proxy both HTTP/1.1 (default) and pass the Host header
#   - Cap request bodies (the app's Content-Length check is bypassable via
#     chunked transfer; valid payloads are ~200 KB, 1MB leaves headroom)
#   - Access logs: the app itself logs nothing (privacy promise); nginx's
#     access_log writes every request with client IPs. This example keeps
#     access_log off — set your own log format/location ONLY if you accept
#     that and disclose it in your privacy notice.

server {
    listen 443 ssl;
    http2 on;
    server_name secrets.example.com;

    client_max_body_size 1m;

    ssl_certificate     /etc/letsencrypt/live/secrets.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/secrets.example.com/privkey.pem;

    location / {
        proxy_pass http://nveil-app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name secrets.example.com;
    # certbot handles the ACME challenge; everything else goes to HTTPS
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
