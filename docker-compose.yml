# Log rotation for both services: Docker's default json-file driver grows
# unboundedly, and while this app's stdout is tiny (privacy: it logs almost
# nothing), postgres and error paths still accumulate. 3 x 10 MB per service
# bounds the disk cost without losing recent diagnostics.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  app:
    container_name: nveil-app
    build: .
    # Caps runaway memory (defense in depth on top of the app's streamed
    # request-body caps): a memory-exhaustion request storm degrades to 503s
    # instead of an OOM-killed container.
    mem_limit: 512m
    logging: *default-logging
    # Reverse-proxy deployments reach this container over a shared Docker
    # network (see deploy/ for ready-made examples). To expose a host port
    # for a non-Docker proxy instead, replace with:
    #   ports: ['127.0.0.1:3000:3000']
    expose:
      - '${PORT:-3000}'
    environment:
      # Next's standalone server otherwise binds to the container hostname
      # (Docker sets HOSTNAME to the container id) and the healthcheck cannot
      # reach it on 127.0.0.1.
      HOSTNAME: 0.0.0.0
      PORT: ${PORT:-3000}
      # Compose builds the URL; the password applies on FIRST volume init only.
      DATABASE_URL: postgresql://nveil:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/nveil
    env_file:
      - path: .env
        required: false
    # Operator legal content (content.example/ has the templates). The host
    # directory is auto-created empty on first start if absent — an empty
    # mount is fine: pages serve placeholders and the footer shows no legal
    # links until files appear (picked up live, no restart needed).
    volumes:
      - ./content:/app/content:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Real endpoint check (includes a database round trip).
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:' + (process.env.PORT || '3000') + '/api/health').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  db:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    logging: *default-logging
    environment:
      POSTGRES_USER: nveil
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: nveil
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nveil -d nveil']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
